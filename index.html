<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portfolio Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#09080B; --surface:#121116; --surface-2:#17161C;
    --border:#232129; --border-soft:#1B1A20;
    --text:#F2EFE9; --text-dim:#A6A3AE; --text-faint:#7A7886;
    --gold:#C9A227; --gold-bright:#DFC15A; --gold-dim:#6B5A20;
    --blue:#4F8FE8; --green:#35C48C; --orange:#E2883D; --purple:#B98FE0;
    --teal:#2DBFAE; --rose:#D67AB1; --red:#E2596B; --gray:#5B6774;
    --serif:'Playfair Display', serif;
    --mono:'IBM Plex Mono', monospace;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:var(--mono);padding:36px 16px 90px;min-height:100vh;}
  .wrap{max-width:640px;margin:0 auto;}
  .page-title{font-size:11px;letter-spacing:.12em;color:var(--text-faint);margin-bottom:4px;}
  .refresh-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;gap:10px;}
  .page-sub{font-size:10.5px;color:var(--text-faint);margin:0;}
  .refresh-btn{font-family:var(--mono);font-size:10px;color:var(--gold-bright);background:none;border:1px solid var(--border);
    border-radius:6px;padding:6px 12px;cursor:pointer;flex:none;}
  .refresh-btn:disabled{opacity:.5;cursor:default;}
  .loading, .error-box{text-align:center;padding:60px 20px;color:var(--text-dim);}
  .error-box{color:var(--red);border:1px solid var(--red);border-radius:10px;background:rgba(226,89,106,.06);}
  .spinner{width:22px;height:22px;border:2px solid var(--border);border-top-color:var(--gold);border-radius:50%;
    animation:spin .8s linear infinite;margin:0 auto 14px;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .goal-card{background:var(--surface);border:1px solid var(--border-soft);border-radius:12px;padding:22px 20px;margin-bottom:14px;position:relative;}
  .privacy-btn{position:absolute;top:14px;right:16px;background:none;border:1px solid var(--border);color:var(--text-dim);border-radius:6px;font-size:9px;padding:4px 8px;cursor:pointer;font-family:var(--mono);}
  .privacy-btn:hover{border-color:var(--gold);}
  .goal-flex{display:flex;gap:18px;align-items:center;}
  .ring-wrap{position:relative;width:140px;height:140px;flex:none;}
  .ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;}
  .rc-eyebrow{font-size:8px;letter-spacing:.12em;color:var(--text-faint);}
  .rc-value{font-family:var(--serif);font-size:18px;font-weight:600;margin:4px 0 2px;}
  .rc-pct{font-size:9px;color:var(--gold-bright);font-family:var(--serif);font-style:italic;}
  .goal-detail{flex:1;min-width:0;}
  .gd-row{display:flex;justify-content:space-between;font-size:10px;color:var(--text-dim);padding:4px 0;border-bottom:1px solid var(--border-soft);}
  .gd-row:last-child{border-bottom:none;}
  .gd-row .k{color:var(--text-faint);}
  .gd-row .v{font-weight:500;}
  .gd-row .v.loss{color:var(--red);}
  .eta-strip{display:flex;justify-content:space-between;margin-top:14px;padding-top:13px;border-top:1px solid var(--border);}
  .eta-block{text-align:center;flex:1;}
  .eta-eyebrow{font-size:7.5px;letter-spacing:.1em;color:var(--text-faint);margin-bottom:3px;}
  .eta-value{font-family:var(--serif);font-size:16px;color:var(--text);}
  .eta-value.target{color:var(--gold-bright);}
  .pace-card{background:var(--surface);border:1px solid var(--border-soft);border-radius:12px;padding:18px 20px 14px;margin-bottom:14px;}
  .pace-title{font-size:10px;letter-spacing:.1em;color:var(--text-faint);margin-bottom:16px;}
  .track-wrap{position:relative;height:34px;margin-bottom:6px;}
  .track{position:absolute;top:14px;left:0;right:0;height:6px;background:var(--border);border-radius:3px;}
  .track-fill{position:absolute;top:0;left:0;height:6px;border-radius:3px;background:linear-gradient(90deg, var(--blue), #7BB3F5);}
  .milestone{position:absolute;top:12px;width:9px;height:9px;border-radius:50%;background:var(--bg);border:2px solid var(--border);transform:translateX(-50%);}
  .milestone.passed{border-color:var(--gold);background:var(--gold);}
  .milestone-label{position:absolute;top:24px;font-size:8px;color:var(--text-faint);transform:translateX(-50%);white-space:nowrap;}
  .runner-marker{position:absolute;top:-9px;width:22px;height:22px;border-radius:50%;background:var(--blue);border:3px solid var(--bg);
    box-shadow:0 0 0 2px var(--blue),0 0 10px rgba(79,143,232,.5);transform:translateX(-50%);display:flex;align-items:center;justify-content:center;}
  .runner-marker svg{width:12px;height:12px;color:#08131F;}
  .finish-flag{position:absolute;top:8px;right:-3px;width:9px;height:16px;
    background:repeating-conic-gradient(var(--text) 0 25%, var(--bg) 0 50%) 0 0/6px 6px;
    border-radius:1px;box-shadow:0 0 0 1px var(--border);}
  .celebrate-burst{position:absolute;top:50%;left:50%;width:4px;height:8px;border-radius:1px;
    opacity:0;animation:celebrate-pop 1.6s ease-out infinite;pointer-events:none;}
  @keyframes celebrate-pop{
    0%{opacity:0;transform:translate(-50%,-50%) rotate(0deg);}
    10%{opacity:1;}
    100%{opacity:0;transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) rotate(220deg);}
  }
  .capital-card{background:var(--surface);border:1px solid var(--border-soft);border-radius:12px;padding:16px 18px;margin-bottom:14px;}
  .capital-title{font-size:10px;letter-spacing:.1em;color:var(--text-faint);margin-bottom:12px;}
  .capital-pools{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .pool-box{background:var(--surface-2);border:1px solid var(--border-soft);border-radius:9px;padding:12px;}
  .pool-label{font-size:9px;letter-spacing:.06em;color:var(--text-faint);margin-bottom:6px;}
  .pool-value{font-family:var(--serif);font-size:16px;font-weight:600;}
  .pool-value.neg{color:var(--red);}
  .pool-sub{font-size:9px;color:var(--text-faint);margin-top:4px;line-height:1.5;}
  .chart-card{background:var(--surface);border:1px solid var(--border-soft);border-radius:12px;padding:16px 18px 12px;margin-bottom:14px;}
  .chart-title{font-size:10px;letter-spacing:.1em;color:var(--text-faint);margin-bottom:2px;}
  .chart-sub{font-size:9px;color:var(--text-faint);margin-bottom:10px;}
  .chart-legend{display:flex;gap:14px;margin-top:6px;font-size:8.5px;color:var(--text-faint);flex-wrap:wrap;}
  .chart-legend span{display:inline-flex;align-items:center;gap:4px;}
  .chart-sw{width:11px;height:2px;display:inline-block;}
  .breadcrumb{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:8px;}
  .crumb{display:flex;align-items:center;gap:5px;font-size:10px;background:var(--surface-2);border:1px solid var(--border);border-radius:5px;padding:3px 7px;color:var(--text-dim);}
  .crumb button{background:none;border:none;color:var(--text-faint);cursor:pointer;font-size:11px;padding:0;}
  .crumb-arrow{color:var(--text-faint);font-size:10px;}
  .filter-bar{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--surface);border:1px solid var(--border-soft);border-radius:9px;padding:9px 13px;margin-bottom:14px;font-size:10.5px;color:var(--text-dim);}
  .filter-bar.active{border-color:var(--gold);}
  .filter-clear{font-family:var(--mono);font-size:10px;font-weight:600;color:var(--gold-bright);background:none;border:none;cursor:pointer;}
  .filter-empty{color:var(--text-faint);}
  .region-card{background:var(--surface);border:1px solid var(--border-soft);border-radius:11px;padding:16px 18px;margin-bottom:10px;}
  .region-title{font-size:10px;letter-spacing:.1em;color:var(--text-faint);margin-bottom:12px;}
  .region-body{display:flex;align-items:center;gap:16px;}
  .region-ring{position:relative;width:104px;height:104px;flex:none;}
  .region-svg path{cursor:pointer;transition:opacity .15s ease, transform .15s ease;transform-origin:center;}
  .region-svg path.dim{opacity:.22;}
  .region-svg path.selected{transform:scale(1.04);}
  .region-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;}
  .region-center .v{font-family:var(--serif);font-size:14px;font-weight:600;}
  .region-center .k{font-size:7.5px;color:var(--text-faint);}
  .region-legend{flex:1;display:flex;flex-direction:column;gap:7px;min-width:0;}
  .rl-row{display:flex;align-items:center;gap:7px;cursor:pointer;font-size:10.5px;transition:opacity .15s ease;}
  .rl-row.dim{opacity:.35;}
  .rl-sw{width:8px;height:8px;border-radius:2px;flex:none;}
  .rl-label{flex:1;color:var(--text-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .rl-val{font-family:var(--mono);color:var(--text-faint);font-size:9.5px;}
  .donut-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px;}
  @media (max-width:460px){.donut-grid{grid-template-columns:1fr;}}
  .donut-card{background:var(--surface);border:1px solid var(--border-soft);border-radius:10px;padding:14px;}
  .donut-title{font-size:9px;letter-spacing:.08em;color:var(--text-faint);margin-bottom:10px;}
  .donut-body{display:flex;align-items:center;gap:10px;}
  .donut-svg path{cursor:pointer;transition:opacity .15s ease, transform .15s ease;transform-origin:center;}
  .donut-svg path.dim{opacity:.22;}
  .donut-svg path.selected{transform:scale(1.045);}
  .donut-center{position:relative;}
  .donut-center-label{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;pointer-events:none;}
  .donut-center-label .v{font-family:var(--serif);font-size:11px;font-weight:600;}
  .donut-center-label .k{font-size:6px;color:var(--text-faint);}
  .legend-list{display:flex;flex-direction:column;gap:5px;flex:1;min-width:0;}
  .legend-row{display:flex;align-items:center;gap:6px;cursor:pointer;font-size:9.5px;transition:opacity .15s ease;}
  .legend-row.dim{opacity:.35;}
  .legend-sw{width:7px;height:7px;border-radius:2px;flex:none;}
  .legend-label{flex:1;color:var(--text-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .legend-val{font-family:var(--mono);color:var(--text-faint);font-size:9px;}
  .section-title{font-size:10px;letter-spacing:.1em;color:var(--text-faint);margin:18px 0 10px;}
  .card{background:var(--surface);border:1px solid var(--border-soft);border-radius:9px;margin-bottom:6px;overflow:hidden;}
  .card:hover{border-color:var(--border);}
  .card.expanded{border-color:var(--blue);}
  .row{display:flex;align-items:center;gap:10px;padding:11px 14px;cursor:pointer;user-select:none;}
  .left-col{display:flex;flex-direction:column;gap:2px;flex:1;min-width:0;}
  .ticker-line{display:flex;align-items:baseline;gap:6px;}
  .ticker{font-family:var(--mono);font-weight:600;font-size:13px;}
  .qty{font-family:var(--mono);font-size:10px;color:var(--text-faint);}
  .quality-num{font-family:var(--mono);font-size:9.5px;font-weight:600;padding:0 4px;border-radius:3px;}
  .q-high{background:rgba(53,196,140,.12);color:var(--green);}
  .q-mid{background:rgba(226,136,61,.12);color:var(--orange);}
  .q-low{background:rgba(226,89,106,.12);color:var(--red);}
  .name{font-size:10px;color:var(--text-faint);}
  .right-col{display:flex;flex-direction:column;align-items:flex-end;gap:1px;flex:none;min-width:100px;}
  .mkt-value{font-family:var(--mono);font-size:13px;font-weight:600;}
  .mkt-value.estimated{color:var(--orange);}
  .local-value{font-family:var(--mono);font-size:9px;color:var(--text-faint);}
  .price-edit-row{display:flex;gap:8px;align-items:center;margin:10px 0 12px;flex-wrap:wrap;}
  .price-edit-input{font-family:var(--mono);font-size:10px;background:var(--surface);color:var(--text);
    border:1px solid var(--border);border-radius:6px;padding:6px 8px;width:130px;}
  .gain-lines{display:flex;flex-direction:column;align-items:flex-end;gap:1px;margin-top:2px;}
  .gain-line{display:flex;align-items:center;gap:4px;font-size:9px;}
  .gain-lbl{color:var(--text-faint);font-size:7.5px;}
  .change{font-family:var(--mono);}
  .change.up{color:var(--green);}
  .change.down{color:var(--red);}
  .change.flat{color:var(--text-faint);}
  .stale-badge{font-size:8px;padding:1px 5px;border-radius:3px;background:rgba(226,89,106,.12);color:var(--red);margin-top:2px;}
  .chevron{color:var(--text-faint);font-size:9px;flex:none;transition:transform .15s ease;}
  .card.expanded .chevron{transform:rotate(180deg);}
  .panel{border-top:1px solid var(--border-soft);padding:12px 14px;display:none;background:var(--surface-2);}
  .card.expanded .panel{display:block;}
  .meta-line{font-size:9.5px;font-family:var(--mono);color:var(--text-faint);margin-bottom:10px;line-height:1.6;}
  .lot-row{display:grid;grid-template-columns:1.1fr .7fr .9fr .8fr 1fr;gap:6px;padding:5px 0;border-bottom:1px solid var(--border-soft);
    font-family:var(--mono);font-size:9.5px;align-items:center;}
  .lot-row:last-child{border-bottom:none;}
  .lot-row.head{color:var(--text-faint);font-size:8px;text-transform:uppercase;font-weight:600;}
  .lot-gl{display:flex;align-items:center;gap:3px;justify-content:flex-end;}
  .lot-gl.up{color:var(--green);}
  .lot-gl.down{color:var(--red);}
  .lot-term{font-size:8px;padding:1px 4px;border-radius:3px;}
  .lot-term.ltcg{background:rgba(53,196,140,.1);color:var(--green);}
  .lot-term.stcg{background:rgba(226,136,61,.1);color:var(--orange);}
  .closed-row{display:flex;justify-content:space-between;align-items:center;background:var(--surface);border:1px solid var(--border-soft);
    border-radius:9px;padding:9px 14px;margin-bottom:6px;font-size:10px;color:var(--text-dim);}
  .closed-row b{font-family:var(--mono);color:var(--text);}
  .closed-filters{display:flex;gap:8px;align-items:center;margin-bottom:10px;flex-wrap:wrap;}
  .closed-card{margin-bottom:6px;}
  .closed-card .closed-row{margin-bottom:0;border-radius:9px 9px 0 0;}
  .closed-card:not(.expanded) .closed-row{border-radius:9px;}
  .closed-detail-panel{display:none;padding:8px 10px 4px;background:var(--surface-2);border:1px solid var(--border-soft);border-top:none;border-radius:0 0 9px 9px;}
  .closed-card.expanded .closed-detail-panel{display:block;}
  .closed-section-card{margin-top:8px;}
  .closed-section-body{display:none;padding-top:10px;}
  .closed-section-card.expanded .closed-section-body{display:block;}
  .hint{font-size:10px;color:var(--text-faint);margin-top:18px;line-height:1.6;}
</style>
</head>
<body>
<div class="wrap">
  <p class="page-title">PORTFOLIO OVERVIEW</p>
  <div class="refresh-row">
    <p class="page-sub" id="asof-line">Loading...</p>
    <button class="refresh-btn" id="refresh-btn" onclick="fullLoad(true)">Refresh prices</button>
  </div>
  <div id="app">
    <div class="loading"><div class="spinner"></div>Fetching live holdings...</div>
  </div>
</div>
<script>
const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbxXmRugzGUz47znt34cT4CR13ZtwOau8ZhFe8YO9KT3ittvuuWFWlh-4sHgZbnDlpqRTw/exec';
let HOLDINGS = [], ACCOUNTS = [], TARGETS = [], TRANSACTIONS = [], filterChain = [], valuesHidden = false;
function isoDateStr(d){ return d.toISOString().slice(0,10); }
function defaultClosedFilter(){
  const today = new Date();
  const monthAgo = new Date(today); monthAgo.setMonth(monthAgo.getMonth()-1);
  return {ticker:'', from: isoDateStr(monthAgo), to: isoDateStr(today)};
}
let closedFilter = defaultClosedFilter();
function toggleValues(){ valuesHidden = !valuesHidden; renderAll(); }
function maskable(str){ return valuesHidden ? '*****' : str; }
function accountBroker(accountId){ const a = ACCOUNTS.find(x => x.account_id === accountId); return a ? a.broker : accountId; }
function activeTarget(){
  const today = new Date();
  const sorted = TARGETS.slice().sort((a,b) => new Date(a.effective_date) - new Date(b.effective_date));
  let active = sorted[0];
  sorted.forEach(t => { if(new Date(t.effective_date) <= today) active = t; });
  return active;
}
function indianGroup(intDigits){
  if(intDigits.length <= 3) return intDigits;
  const lastThree = intDigits.slice(-3);
  const rest = intDigits.slice(0, -3).replace(/\B(?=(\d{2})+(?!\d))/g, ',');
  return rest + ',' + lastThree;
}
function fmtIndian(v, maxFrac){
  const neg = v < 0;
  const fixed = Math.abs(v).toFixed(maxFrac===undefined?2:maxFrac);
  const parts = fixed.split('.');
  return (neg?'-':'') + indianGroup(parts[0]) + (parts[1] && Number(parts[1])>0 ? '.' + parts[1] : '');
}
function fmtMoney(v, ccy){
  if(v === null || v === undefined) return '-';
  const sym = ccy === 'INR' ? 'Rs ' : ccy === 'AED' ? 'AED ' : ccy === 'USD' ? '$' : '';
  // INR uses the Indian numbering system (lakh/crore - last 3 digits, then groups
  // of 2, e.g. 12,34,567) rather than the Western 3-digit grouping.
  const numStr = ccy === 'INR' ? fmtIndian(v, 2) : Math.abs(v).toLocaleString(undefined, {maximumFractionDigits:2});
  return sym + numStr + (v<0 && ccy!=='INR' ? ' (neg)':'');
}
function fmtUsd(v){ if(v === null || v === undefined) return '-'; return '$' + v.toLocaleString(undefined, {maximumFractionDigits:0}); }

function renderGoalAndPace(){
  const target = activeTarget();
  const nonCash = HOLDINGS.filter(h => !String(h.asset_id).startsWith('CASH-') && h.quantity > 0);
  const allNonCash = HOLDINGS.filter(h => !String(h.asset_id).startsWith('CASH-'));
  const knownValue = HOLDINGS.reduce((s,h) => s + (h.market_value_estimated!==undefined ? (h.market_value_estimated||0) : (h.market_value_base||0)), 0);
  // Total gain = unrealized (open positions) + realized (open and closed) - closed
  // positions carry quantity 0 but a nonzero realized_gain_base, so allNonCash (not
  // nonCash) is used here to include them. Today's gain is naturally 0 for closed
  // positions since day_gain_base is derived from quantity, so summing over
  // allNonCash is safe for both.
  const totalGainBase = allNonCash.reduce((s,h) => s + (h.unrealized_gain_base||0) + (h.realized_gain_base||0), 0);
  const dayGainBase = allNonCash.reduce((s,h) => s + (h.day_gain_base||0), 0);
  const estimatedPositions = nonCash.filter(h => h.is_estimated);
  const goalAmount = target ? Number(target.goal_amount_usd) : null;
  const targetDate = target ? target.target_date : null;
  const targetCagr = target ? Number(target.target_cagr) : null;
  const monthly = target ? Number(target.monthly_contribution_usd) : null;
  const pct = goalAmount ? (knownValue/goalAmount*100) : 0;
  const milestonePcts = [12.5, 25, 50, 100];

  document.getElementById('goal-section').innerHTML =
    '<div class="goal-card">' +
      '<button class="privacy-btn" onclick="toggleValues()">' + (valuesHidden?'show':'hide') + '</button>' +
      '<div class="goal-flex">' +
        '<div class="ring-wrap"><svg width="140" height="140" viewBox="0 0 140 140" style="transform:rotate(-90deg)">' +
          '<circle cx="70" cy="70" r="60" fill="none" stroke="#1E1C24" stroke-width="7"/>' +
          '<circle cx="70" cy="70" r="60" fill="none" stroke="#4F8FE8" stroke-width="7" stroke-dasharray="' + (Math.min(pct,100)/100*2*Math.PI*60).toFixed(1) + ' 10000" stroke-linecap="round"/>' +
        '</svg><div class="ring-center"><div class="rc-eyebrow">PORTFOLIO</div><div class="rc-value">' + maskable(fmtUsd(knownValue)) + '</div>' +
        '<div class="rc-pct">' + (goalAmount ? pct.toFixed(1)+'% of '+maskable(fmtUsd(goalAmount)) : 'no active target') + '</div></div></div>' +
        '<div class="goal-detail"><div class="gd-row"><span class="k">Positions</span><span class="v">' + nonCash.length + '</span></div>' +
        '<div class="gd-row"><span class="k">At cost (no live price)</span><span class="v ' + (estimatedPositions.length?'loss':'') + '">' + estimatedPositions.length + '</span></div>' +
        '<div class="gd-row"><span class="k">Total Gain</span><span class="change ' + (totalGainBase>=0?'up':'down') + '">' + (totalGainBase>=0?'+':'-') + maskable(fmtUsd(Math.abs(totalGainBase))) + '</span></div>' +
        '<div class="gd-row"><span class="k">Today\'s Gain</span><span class="change ' + (dayGainBase>=0?'up':'down') + '">' + (dayGainBase>=0?'+':'-') + maskable(fmtUsd(Math.abs(dayGainBase))) + '</span></div></div>' +
      '</div>' +
      (target ?
        '<div class="eta-strip"><div class="eta-block"><div class="eta-eyebrow">TARGET DATE</div><div class="eta-value target">' + new Date(targetDate).getFullYear() + '</div></div>' +
        '<div class="eta-block"><div class="eta-eyebrow">TARGET CAGR</div><div class="eta-value">' + targetCagr + '%</div></div>' +
        '<div class="eta-block"><div class="eta-eyebrow">MONTHLY PLAN</div><div class="eta-value">' + maskable(fmtUsd(monthly)) + '</div></div></div>'
        : '<p class="hint" style="margin-top:12px;">No active row in <b>targets</b>.</p>') +
      (estimatedPositions.length ? '<p class="hint" style="margin-top:10px;">At-cost positions (' + estimatedPositions.map(function(p){return p.asset_id;}).join(', ') + ') use purchase price, not a live value.</p>' : '') +
    '</div>';

  // Milestones are at real 12.5/25/50/100% of goal - visually those bunch together
  // (12.5->25 is a 12.5-wide gap, 50->100 is a 50-wide gap) since raw % literally
  // sets track position. Map real % to an EQUALLY-SPACED visual position instead
  // (0/12.5/25/50/100 -> 0/25/50/75/100), piecewise-linear within each segment, so
  // the posts sit evenly apart while their labels keep showing the true percentage.
  // The fill bar and runner marker use the same mapping so they stay visually
  // aligned with the posts along the same (nonlinear) track scale.
  function milestoneVisualPct(realPct){
    const stops = [{r:0,v:0},{r:12.5,v:25},{r:25,v:50},{r:50,v:75},{r:100,v:100}];
    const clamped = Math.max(0, Math.min(100, realPct));
    for(let i=0;i<stops.length-1;i++){
      const a=stops[i], b=stops[i+1];
      if(clamped>=a.r && clamped<=b.r){
        const frac = (b.r===a.r) ? 0 : (clamped-a.r)/(b.r-a.r);
        return a.v + frac*(b.v-a.v);
      }
    }
    return 100;
  }
  const visualPct = milestoneVisualPct(pct);
  // Celebration is proximity-based, not a hard crossing-trigger: if the current
  // value sits within $2,000 of ANY milestone's dollar amount (checked once per
  // load), a short confetti burst plays around the runner marker itself - not a
  // separate element. Deliberately a band, not a point, since price moves day to
  // day and a point-trigger would flicker on/off across refreshes near the line.
  const NEAR_MILESTONE_BAND_USD = 2000;
  const nearMilestone = goalAmount && milestonePcts.some(function(m){
    return Math.abs(knownValue - goalAmount*m/100) <= NEAR_MILESTONE_BAND_USD;
  });
  const burstColors = ['var(--gold-bright)','var(--blue)','var(--green)','var(--rose)'];
  const burstHtml = nearMilestone ? burstColors.map(function(c,i){
    const angle = (i/burstColors.length)*2*Math.PI + 0.4;
    const dx = Math.round(Math.cos(angle)*20), dy = Math.round(Math.sin(angle)*20-14);
    return '<div class="celebrate-burst" style="background:' + c + ';--dx:' + dx + 'px;--dy:' + dy + 'px;animation-delay:' + (i*0.12) + 's;"></div>';
  }).join('') : '';
  document.getElementById('pace-section').innerHTML =
    '<div class="pace-card"><div class="pace-title">PROGRESS TO GOAL - milestones at 12.5/25/50/100% of goal_amount_usd, evenly spaced for readability</div>' +
    '<div class="track-wrap"><div class="track"><div class="track-fill" style="width:' + visualPct + '%"></div></div><div class="finish-flag"></div>' +
    milestonePcts.map(function(m){ return '<div class="milestone ' + (pct>=m?'passed':'') + '" style="left:' + milestoneVisualPct(m) + '%"></div><div class="milestone-label" style="left:' + milestoneVisualPct(m) + '%">' + m + '%</div>'; }).join('') +
    '<div class="runner-marker" style="left:' + visualPct + '%"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M13.49 5.48c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm-3.6 13.9l1-4.4 2.1 2v6h2v-7.5l-2.1-2 .6-3c1.3 1.5 3.3 2.5 5.5 2.5v-2c-1.9 0-3.5-1-4.3-2.4l-1-1.6c-.4-.6-1-1-1.7-1-.3 0-.5.1-.8.1l-5.2 2.2v4.7h2v-3.4l1.8-.7-1.6 8.1-4.9-1-.4 2 7 1.4z"/></svg>' + burstHtml + '</div>' +
    '</div></div>';

  renderCapitalCard();
  renderTrajectoryChart(knownValue, target);
  renderContributionChart(target);
}

function renderTrajectoryChart(currentValue, target){
  if(!target){ document.getElementById('trajectory-section').innerHTML=''; return; }
  const goalAmount = Number(target.goal_amount_usd);
  const plannedMonthly = Number(target.monthly_contribution_usd);
  const targetCagr = Number(target.target_cagr)/100;

  // Real contribution pace, blended into the ETA projection instead of treating the
  // trajectory and CONTRIBUTION PACE chart as two disconnected things. Uses a
  // TRAILING window (last 6 months, or the full history if the target is younger
  // than that) rather than averaging since the target's effective_date - the plan
  // stepped up from $2,000/mo to $3,000/mo, so a since-inception average would
  // dilute the current, more realistic pace with years of the older lower amount.
  // The return RATE still uses target_cagr for both lines - a real trailing return
  // (XIRR) is CALCULATE_RETURNS, a separate not-yet-built piece (bucket D) - only
  // the contribution side of the projection is upgraded here.
  const startDate = new Date(target.effective_date);
  const today = new Date();
  const paceWindowMonths = 6;
  const paceWindowStart = new Date(today); paceWindowStart.setMonth(paceWindowStart.getMonth()-paceWindowMonths);
  const effectivePaceStart = paceWindowStart > startDate ? paceWindowStart : startDate;
  const paceMonthsElapsed = Math.max(1, (today-effectivePaceStart)/(1000*60*60*24*30));
  const recentContributed = TRANSACTIONS.filter(function(t){ return t.action==='BUY' && new Date(t.date) >= effectivePaceStart && t.base_currency_amount; })
    .reduce(function(s,t){ return s+Number(t.base_currency_amount); },0);
  const actualMonthlyPace = paceMonthsElapsed > 0 ? recentContributed/paceMonthsElapsed : plannedMonthly;
  const paceWindowLabel = effectivePaceStart > startDate ? ('last ' + paceWindowMonths + 'mo') : 'since ' + startDate.toLocaleDateString(undefined,{month:'short',year:'numeric'});

  function project(monthlyAmt, months){
    const r = targetCagr/12; let v = currentValue; const series=[v];
    for(let i=1;i<=months;i++){ v = v*(1+r)+monthlyAmt; series.push(v); if(v>=goalAmount) return {series:series, hitMonth:i}; }
    return {series:series, hitMonth:null};
  }
  function etaLabel(hitMonth){
    if(hitMonth===null || hitMonth===undefined) return 'beyond 20yr window';
    const d = new Date(); d.setMonth(d.getMonth()+hitMonth);
    return d.toLocaleDateString(undefined, {month:'short', year:'numeric'});
  }
  const goldProj = project(plannedMonthly, 240);
  const blueProj = project(actualMonthlyPace, 240);
  const monthsMax = Math.max(goldProj.hitMonth||240, blueProj.hitMonth||240);
  const W=560,H=158,pad=8,padBottom=22;
  const maxV = goalAmount*1.05;
  const toX = function(i){ return pad + (i/monthsMax)*(W-2*pad); };
  const toY = function(v){ return H-padBottom - (Math.min(v,maxV)/maxV)*(H-pad-padBottom); };
  const goldPath = goldProj.series.slice(0,(goldProj.hitMonth||monthsMax)+1).map(function(v,i){ return (i===0?'M':'L')+toX(i)+' '+toY(v); }).join(' ');
  const bluePath = blueProj.series.slice(0,(blueProj.hitMonth||monthsMax)+1).map(function(v,i){ return (i===0?'M':'L')+toX(i)+' '+toY(v); }).join(' ');
  // Tick density adapts to horizon length so a 3-year ETA doesn't get only one or
  // two ticks the way a fixed 2-year step would produce - annually up to 10 years,
  // every 2 years beyond that.
  const yearTicks = [];
  const tickStepYears = monthsMax <= 120 ? 1 : 2;
  for(let yrs=0; yrs*12<=monthsMax; yrs+=tickStepYears){ yearTicks.push({month:yrs*12, year: today.getFullYear()+yrs}); }
  document.getElementById('trajectory-section').innerHTML =
    '<div class="chart-card"><div class="chart-title">TRAJECTORY TO GOAL</div>' +
    '<div class="chart-sub">Compounding curves from your real current value - contribution pace blended in from actual purchases</div>' +
    '<svg width="100%" height="158" viewBox="0 0 560 158" preserveAspectRatio="none">' +
    '<line x1="' + pad + '" y1="' + toY(goalAmount) + '" x2="' + (W-pad) + '" y2="' + toY(goalAmount) + '" stroke="#232129" stroke-width="1" stroke-dasharray="3 3"/>' +
    yearTicks.map(function(t){ return '<line x1="' + toX(t.month) + '" y1="' + pad + '" x2="' + toX(t.month) + '" y2="' + (H-padBottom) + '" stroke="#1B1A20" stroke-width="1"/>'; }).join('') +
    '<path d="' + goldPath + '" fill="none" stroke="#C9A227" stroke-width="2"/>' +
    '<path d="' + bluePath + '" fill="none" stroke="#4F8FE8" stroke-width="2"/>' +
    '<circle cx="' + toX(0) + '" cy="' + toY(currentValue) + '" r="3.5" fill="#F2EFE9"/>' +
    '<text x="' + (toX(0)+6) + '" y="' + (toY(currentValue)-6) + '" fill="#A6A3AE" font-size="9" font-family="IBM Plex Mono">today</text>' +
    '<text x="' + (W-pad-24) + '" y="' + (toY(goalAmount)-6) + '" fill="#7A7886" font-size="9" font-family="IBM Plex Mono">' + fmtUsd(goalAmount) + '</text>' +
    '<line x1="' + pad + '" y1="' + (H-padBottom) + '" x2="' + (W-pad) + '" y2="' + (H-padBottom) + '" stroke="#232129" stroke-width="1"/>' +
    yearTicks.map(function(t){ return '<line x1="' + toX(t.month) + '" y1="' + (H-padBottom) + '" x2="' + toX(t.month) + '" y2="' + (H-padBottom+5) + '" stroke="#A6A3AE" stroke-width="1.2"/>' +
      '<text x="' + toX(t.month) + '" y="' + (H-padBottom+16) + '" fill="#D7D4CC" font-size="10" font-family="IBM Plex Mono" text-anchor="middle">' + t.year + '</text>'; }).join('') +
    '</svg><div class="chart-legend">' +
    '<span><span class="chart-sw" style="background:#C9A227"></span>Planned pace (' + fmtUsd(plannedMonthly) + '/mo) - ETA ' + etaLabel(goldProj.hitMonth) + '</span>' +
    '<span><span class="chart-sw" style="background:#4F8FE8"></span>Actual pace (' + paceWindowLabel + ', ' + fmtUsd(Math.round(actualMonthlyPace)) + '/mo) - ETA ' + etaLabel(blueProj.hitMonth) + '</span>' +
    '</div><p class="hint" style="margin-top:6px;">Both lines use the target CAGR (' + (targetCagr*100).toFixed(0) + '%) as the return rate - a real trailing return (XIRR) isn\'t computed yet.</p></div>';
}

function renderContributionChart(target){
  if(!target || !TRANSACTIONS.length){ document.getElementById('contribution-section').innerHTML=''; return; }
  const startDate = new Date(target.effective_date);
  const monthly = Number(target.monthly_contribution_usd);
  const buys = TRANSACTIONS.filter(function(t){ return t.action==='BUY' && new Date(t.date) >= startDate && t.base_currency_amount; })
    .sort(function(a,b){ return new Date(a.date)-new Date(b.date); });
  const today = new Date();
  const monthsElapsed = Math.max(1, Math.round((today-startDate)/(1000*60*60*24*30)));
  let cum = 0;
  const actualPoints = buys.map(function(b){ cum += Number(b.base_currency_amount); return {date:new Date(b.date), value:cum}; });
  const actualTotal = cum;
  const plannedTotal = monthly * monthsElapsed;
  const W=560,H=130,pad=8,padBottom=20;
  const maxV = Math.max(actualTotal, plannedTotal) * 1.1 || 1;
  const toX = function(d){ return pad + ((d-startDate)/(today-startDate))*(W-2*pad); };
  const toY = function(v){ return H-padBottom - (v/maxV)*(H-pad-padBottom); };
  const actualPath = actualPoints.length ? ('M'+toX(startDate)+' '+toY(0)+' '+actualPoints.map(function(p){ return 'L'+toX(p.date)+' '+toY(p.value); }).join(' ')) : '';
  const plannedPath = 'M'+toX(startDate)+' '+toY(0)+' L'+toX(today)+' '+toY(plannedTotal);
  // Tick step adapts to how long the target's been active: monthly when young,
  // widening to quarterly then yearly so labels never crowd together.
  const tickStepMonths = monthsElapsed<=8 ? 1 : monthsElapsed<=20 ? 3 : monthsElapsed<=48 ? 6 : 12;
  const dateTicks = [];
  for(let m=0; ; m+=tickStepMonths){
    const d = new Date(startDate); d.setMonth(d.getMonth()+m);
    if(d>today) break;
    dateTicks.push(d);
  }
  if(!dateTicks.length || dateTicks[dateTicks.length-1].getTime()!==today.getTime()) dateTicks.push(today);
  const tickFmt = tickStepMonths>=12 ? {year:'numeric'} : {month:'short',year:'2-digit'};
  document.getElementById('contribution-section').innerHTML =
    '<div class="chart-card"><div class="chart-title">CONTRIBUTION PACE</div>' +
    '<div class="chart-sub">Cumulative real purchases vs. planned ' + fmtUsd(monthly) + '/month since ' + startDate.toLocaleDateString() + '</div>' +
    '<svg width="100%" height="130" viewBox="0 0 560 130" preserveAspectRatio="none">' +
    dateTicks.map(function(d){ return '<line x1="' + toX(d) + '" y1="' + pad + '" x2="' + toX(d) + '" y2="' + (H-padBottom) + '" stroke="#1B1A20" stroke-width="1"/>'; }).join('') +
    '<path d="' + plannedPath + '" fill="none" stroke="#7A7886" stroke-width="1.5" stroke-dasharray="4 3"/>' +
    '<path d="' + actualPath + '" fill="none" stroke="#35C48C" stroke-width="2"/>' +
    '<line x1="' + pad + '" y1="' + (H-padBottom) + '" x2="' + (W-pad) + '" y2="' + (H-padBottom) + '" stroke="#232129" stroke-width="1"/>' +
    dateTicks.map(function(d){ return '<line x1="' + toX(d) + '" y1="' + (H-padBottom) + '" x2="' + toX(d) + '" y2="' + (H-padBottom+5) + '" stroke="#A6A3AE" stroke-width="1.2"/>' +
      '<text x="' + toX(d) + '" y="' + (H-padBottom+14) + '" fill="#D7D4CC" font-size="10" font-family="IBM Plex Mono" text-anchor="middle">' + d.toLocaleDateString(undefined,tickFmt) + '</text>'; }).join('') +
    '</svg><div class="chart-legend">' +
    '<span><span class="chart-sw" style="background:#35C48C"></span>Actual: ' + fmtUsd(actualTotal) + '</span>' +
    '<span>Planned: ' + fmtUsd(plannedTotal) + '</span></div></div>';
}

function polarToCartesian(cx,cy,r,angleDeg){ const a=(angleDeg-90)*Math.PI/180; return {x:cx+r*Math.cos(a), y:cy+r*Math.sin(a)}; }
function arcPath(cx,cy,rOuter,rInner,startAngle,endAngle){
  const p1=polarToCartesian(cx,cy,rOuter,endAngle), p2=polarToCartesian(cx,cy,rOuter,startAngle);
  const p3=polarToCartesian(cx,cy,rInner,startAngle), p4=polarToCartesian(cx,cy,rInner,endAngle);
  const large=endAngle-startAngle>180?1:0;
  return 'M ' + p1.x + ' ' + p1.y + ' A ' + rOuter + ' ' + rOuter + ' 0 ' + large + ' 0 ' + p2.x + ' ' + p2.y + ' L ' + p3.x + ' ' + p3.y + ' A ' + rInner + ' ' + rInner + ' 0 ' + large + ' 1 ' + p4.x + ' ' + p4.y + ' Z';
}
function resolveColor(v){ const el=document.createElement('div'); el.style.color=v; document.body.appendChild(el); const c=getComputedStyle(el).color; document.body.removeChild(el); return c; }
const DIM_COLORS = {
  region: {US:'var(--blue)',UAE:'var(--green)',India:'var(--orange)',Crypto:'var(--purple)',Other:'var(--gray)'},
  currency: {USD:'var(--blue)',AED:'var(--teal)',INR:'var(--rose)'},
  classification: {Core:'var(--green)',Tactical:'var(--blue)',Hedge:'var(--red)'},
  cap: {Large:'var(--blue)',Mid:'var(--teal)',Small:'var(--orange)',NA:'var(--gray)'},
  broker: {}
};
function dimValue(h, dim){
  if(dim==='region') return h.region;
  if(dim==='currency') return h.currency;
  if(dim==='classification') return h.classification || 'Unclassified';
  if(dim==='cap') return h.market_cap_segment || 'NA';
  if(dim==='broker') return accountBroker(h.account_id);
  return 'Other';
}
function colorFor(dim, label){
  if(DIM_COLORS[dim][label]) return DIM_COLORS[dim][label];
  const palette = ['var(--blue)','var(--green)','var(--orange)','var(--purple)','var(--teal)','var(--rose)'];
  const idx = Object.keys(DIM_COLORS[dim]).length % palette.length;
  DIM_COLORS[dim][label] = palette[idx]; return DIM_COLORS[dim][label];
}
function applyChainExcept(exceptDim, data){ return data.filter(function(h){ return filterChain.every(function(f){ return f.dim===exceptDim ? true : dimValue(h,f.dim)===f.value; }); }); }
function fullyFiltered(data){ return data.filter(function(h){ return filterChain.every(function(f){ return dimValue(h,f.dim)===f.value; }); }); }
function aggregate(dim, data){
  const map = {};
  data.forEach(function(h){ const label = dimValue(h,dim); map[label] = (map[label]||0) + (h.market_value_estimated!==undefined?(h.market_value_estimated||0):(h.market_value_base||0)); });
  return Object.entries(map).map(function(e){ return {label:e[0], value:e[1]}; }).sort(function(a,b){ return b.value-a.value; });
}
function computeRendered(dim, data){
  const activeInThisDim = filterChain.find(function(f){ return f.dim===dim; });
  const baseData = applyChainExcept(dim, data);
  const slices = aggregate(dim, baseData);
  const total = slices.reduce(function(s,d){ return s+d.value; },0);
  let angle=0;
  const rendered = slices.map(function(s){
    const pct = total ? s.value/total : 0;
    const startAngle=angle, endAngle=angle+pct*360; angle=endAngle;
    return Object.assign({}, s, {startAngle:startAngle, endAngle:endAngle, pct:pct,
      isSelected: activeInThisDim && activeInThisDim.value===s.label,
      isDimmed: activeInThisDim && activeInThisDim.value!==s.label,
      color:colorFor(dim,s.label)});
  });
  return {rendered:rendered, total:total, activeInThisDim:activeInThisDim};
}
function renderRegionRing(allData){
  const r = computeRendered('region', allData);
  const paths = r.rendered.map(function(s){ return '<path d="' + arcPath(52,52,46,30,s.startAngle,s.endAngle) + '" fill="' + resolveColor(s.color) + '" class="' + (s.isSelected?'selected':'') + ' ' + (s.isDimmed?'dim':'') + '" onclick="onSliceClick(\'region\',\'' + s.label + '\')"></path>'; }).join('');
  const legend = r.rendered.map(function(s){ return '<div class="rl-row ' + (s.isDimmed?'dim':'') + '" onclick="onSliceClick(\'region\',\'' + s.label + '\')"><span class="rl-sw" style="background:' + resolveColor(s.color) + '"></span><span class="rl-label">' + s.label + '</span><span class="rl-val">' + maskable(fmtUsd(s.value)) + ' - ' + Math.round(s.pct*100) + '%</span></div>'; }).join('');
  return '<div class="region-card"><div class="region-title">BY REGION</div><div class="region-body"><div class="region-ring"><svg class="region-svg" width="104" height="104" viewBox="0 0 104 104">' + paths + '</svg><div class="region-center"><div class="v">' + maskable(fmtUsd(r.total)) + '</div><div class="k">' + (r.activeInThisDim?r.activeInThisDim.value:(filterChain.length?'Subset':'Total')) + '</div></div></div><div class="region-legend">' + legend + '</div></div></div>';
}
function renderDonut(dim, title, allData){
  const r = computeRendered(dim, allData);
  const paths = r.rendered.map(function(s){ return '<path d="' + arcPath(40,40,32,20,s.startAngle,s.endAngle) + '" fill="' + resolveColor(s.color) + '" class="' + (s.isSelected?'selected':'') + ' ' + (s.isDimmed?'dim':'') + '" onclick="onSliceClick(\'' + dim + '\',\'' + s.label + '\')"></path>'; }).join('');
  // For the currency breakdown specifically, also show each slice's own-currency
  // total (not just its USD-converted share) - lets AED/INR totals be compared
  // directly against the actual brokerage platform, same reasoning as the
  // per-ticker LTP/Total Invested fields.
  const baseDataForLocal = dim==='currency' ? applyChainExcept(dim, allData) : null;
  const legend = r.rendered.map(function(s){
    let localStr = '';
    if(dim==='currency' && s.label!=='USD'){
      const localTotal = baseDataForLocal.filter(function(h){ return h.currency===s.label; })
        .reduce(function(sum,h){ return sum+(h.market_value_trade_ccy||0); },0);
      localStr = ' (' + maskable(fmtMoney(localTotal, s.label)) + ')';
    }
    return '<div class="legend-row ' + (s.isDimmed?'dim':'') + '" onclick="onSliceClick(\'' + dim + '\',\'' + s.label + '\')"><span class="legend-sw" style="background:' + resolveColor(s.color) + '"></span><span class="legend-label">' + s.label + '</span><span class="legend-val">' + Math.round(s.pct*100) + '%' + localStr + '</span></div>';
  }).join('');
  return '<div class="donut-card"><div class="donut-title">' + title + '</div><div class="donut-body"><div class="donut-center"><svg class="donut-svg" width="80" height="80" viewBox="0 0 80 80">' + paths + '</svg><div class="donut-center-label"><div class="v">' + maskable(fmtUsd(r.total)) + '</div><div class="k">' + (r.activeInThisDim?r.activeInThisDim.value:(filterChain.length?'Subset':'Total')) + '</div></div></div><div class="legend-list">' + legend + '</div></div></div>';
}
function onSliceClick(dim, value){
  const idx = filterChain.findIndex(function(f){ return f.dim===dim; });
  if(idx>=0){ if(filterChain[idx].value===value) filterChain.splice(idx,1); else filterChain[idx]={dim:dim,value:value}; }
  else filterChain.push({dim:dim,value:value});
  renderAll();
}
function removeCrumb(i){ filterChain.splice(i,1); renderAll(); }
function clearFilter(){ filterChain=[]; renderAll(); }
function renderFiltersAndRings(){
  // Invested-only set (excludes cash) - used for region/classification/market cap,
  // where cash doesn't have a meaningful value (no classification, no market cap).
  const investedData = HOLDINGS.filter(function(h){ return !String(h.asset_id).startsWith('CASH-') && h.quantity > 0; });
  // Currency and broker exposure both legitimately include cash sitting in that
  // currency/account - excluding it there made these donuts' totals silently
  // smaller than the main ring's total (which does include cash), looking like an
  // unexplained discrepancy. Cash rows always have quantity = balance (can be 0 or
  // negative), so filter on asset_id shape instead of quantity>0 for this set.
  const withCashData = HOLDINGS.filter(function(h){ return String(h.asset_id).startsWith('CASH-') || h.quantity > 0; });
  document.getElementById('region-ring-section').innerHTML = renderRegionRing(investedData);
  document.getElementById('donut-grid').innerHTML =
    renderDonut('currency','BY CURRENCY (incl. cash)', withCashData) + renderDonut('classification','BY CLASSIFICATION', investedData) +
    renderDonut('cap','BY MARKET CAP', investedData) + renderDonut('broker','BY BROKER (incl. cash)', withCashData);
  document.getElementById('breadcrumb').innerHTML = filterChain.map(function(f,i){ return (i>0?'<span class="crumb-arrow">-></span>':'') + '<span class="crumb">' + f.value + '<button onclick="removeCrumb(' + i + ')">x</button></span>'; }).join('');
  const bar=document.getElementById('filter-bar'), text=document.getElementById('filter-text'), btn=document.getElementById('filter-clear-btn');
  if(filterChain.length){
    const subset = fullyFiltered(investedData);
    bar.classList.add('active'); text.classList.remove('filter-empty');
    text.textContent = 'Filtered: ' + maskable(fmtUsd(subset.reduce(function(s,h){ return s+(h.market_value_estimated||h.market_value_base||0); },0))) + ' - ' + subset.length + ' position(s)';
    btn.style.display='inline-block';
  } else {
    bar.classList.remove('active'); text.classList.add('filter-empty');
    text.textContent = 'No filter active - showing full portfolio'; btn.style.display='none';
  }
}
function qClass(q){ if(q===''||q===null||q===undefined) return 'q-mid'; return q>=7.5?'q-high':q>=5.5?'q-mid':'q-low'; }
function renderTickerCards(){
  const allData = HOLDINGS.filter(function(h){ return !String(h.asset_id).startsWith('CASH-'); });
  const open = fullyFiltered(allData).filter(function(h){ return h.quantity > 0; });
  // Was quantity===0 only, which silently dropped partially-closed positions
  // (some sold, some still held) - CalcEngine already computes their realized
  // gain correctly, this just widens what the section shows.
  const closed = allData.filter(function(h){ return h.quantity === 0 || Math.abs(h.realized_gain_base||0) > 1e-9; });
  const sorted = open.slice().sort(function(a,b){ return ((b.market_value_estimated||b.market_value_base)||0) - ((a.market_value_estimated||a.market_value_base)||0); });
  const cardsHtml = sorted.map(function(h,i){
    const dayDir = h.day_gain_pct===null ? 'flat' : h.day_gain_pct>0 ? 'up' : h.day_gain_pct<0 ? 'down' : 'flat';
    const dayStr = h.day_gain_pct===null ? '-' : (h.day_gain_pct>0?'+':'') + h.day_gain_pct.toFixed(2) + '%';
    const totDir = h.total_gain_pct===null ? 'flat' : h.total_gain_pct>0 ? 'up' : h.total_gain_pct<0 ? 'down' : 'flat';
    const totStr = h.total_gain_pct===null ? '-' : (h.total_gain_pct>0?'+':'') + h.total_gain_pct.toFixed(1) + '%';
    const stale = h.price_stale_days !== null && h.price_stale_days > 10;
    // LTP and Total invested are shown in the BUY currency (h.currency), never
    // market_value_base's USD, so they line up with what the brokerage platform
    // itself shows - h.latest_price_trade_ccy/h.cost_basis_trade_ccy handle the
    // conversion server-side, same fields the AED-value fix relies on.
    const ltpStr = h.latest_price_trade_ccy!==null && h.latest_price_trade_ccy!==undefined
      ? fmtMoney(h.latest_price_trade_ccy, h.currency) : '-';
    const totalInvestedStr = h.cost_basis_trade_ccy!==null && h.cost_basis_trade_ccy!==undefined
      ? fmtMoney(h.cost_basis_trade_ccy, h.currency) : '-';
    const localVal = h.currency !== 'USD' ? fmtMoney(h.market_value_trade_ccy||0, h.currency) : null;
    const displayValue = h.market_value_estimated!==undefined ? h.market_value_estimated : h.market_value_base;
    const cardKey = h.account_id + '__' + h.asset_id;
    return '<div class="card" id="tc-' + i + '"><div class="row" onclick="toggleCard(' + i + ')">' +
      '<div class="left-col"><div class="ticker-line"><span class="ticker">' + h.asset_id + '</span>' +
      '<span class="qty">x' + Number(h.quantity).toLocaleString(undefined,{maximumFractionDigits:4}) + '</span>' +
      '<span class="quality-num ' + qClass(h.conviction) + '">' + (h.conviction!==''&&h.conviction!==null? Number(h.conviction).toFixed(1) : '-') + '</span></div>' +
      '<span class="name">' + (h.asset_name||'') + ' - ' + h.account_id + '</span>' +
      '<span class="local-value">LTP ' + maskable(ltpStr) + '</span></div>' +
      '<div class="right-col"><span class="mkt-value ' + (h.is_estimated?'estimated':'') + '">' + maskable(displayValue!==null?fmtUsd(displayValue):'-') + (h.is_estimated?' *':'') + '</span>' +
      (localVal?('<span class="local-value">' + maskable(localVal) + '</span>'):'') +
      '<div class="gain-lines"><div class="gain-line"><span class="gain-lbl">24H</span><span class="change ' + dayDir + '">' + dayStr + '</span></div>' +
      '<div class="gain-line"><span class="gain-lbl">ALL-TIME</span><span class="change ' + totDir + '">' + totStr + '</span></div></div>' +
      (stale?('<span class="stale-badge">' + h.price_stale_days + 'd stale</span>'):'') + '</div><span class="chevron">v</span></div>' +
      '<div class="panel"><div class="meta-line">Avg cost ' + h.avg_cost_per_unit.toFixed(4) + ' ' + h.currency + ' - Total invested ' + maskable(totalInvestedStr) + ' - Realized ' + fmtUsd(h.realized_gain_base) + ' - Fees paid ' + fmtUsd(h.total_fees_paid_base) +
      (h.is_estimated?'<br><span style="color:var(--orange)">* At cost - no live price has ever been fetched.</span>':'') + '</div>' +
      (h.manual_override?(
      '<div class="price-edit-row" onclick="event.stopPropagation()">' +
      '<input type="number" step="any" placeholder="Set price (' + h.currency + ')" id="pe-' + i + '" name="pe-' + i + '" class="price-edit-input">' +
      '<button class="refresh-btn" onclick="submitManualPrice(\'' + cardKey + '\', \'pe-' + i + '\')">Save price</button>' +
      '<button class="refresh-btn" onclick="submitResumeAutoFetch(\'' + cardKey + '\')">Resume auto-fetch</button>' +
      '</div>'
      ):'') +
      '<div class="lot-row head"><span>Lot</span><span>Qty</span><span>Cost</span><span>Term</span><span style="text-align:right">G/L</span></div>' +
      (h.lots||[]).map(function(l){ return '<div class="lot-row"><span>' + l.lot_id + '<br><span style="color:var(--text-faint)">' + l.date + '</span></span><span>' + l.qty + '</span><span>' + l.cost_per_unit + '</span>' +
        '<span>' + (l.term?('<span class="lot-term ' + l.term.toLowerCase() + '">' + l.term + '</span>'):'-') + '</span>' +
        '<span class="lot-gl ' + (l.unrealized_gain_base>=0?'up':'down') + '">' + (l.harvest_candidate?'[H] ':'') + (l.unrealized_gain_base!==null?fmtUsd(l.unrealized_gain_base):'-') + '</span></div>'; }).join('') +
      '</div></div>';
  }).join('');
  const closedTotalAll = closed.reduce(function(s,h){ return s+(h.realized_gain_base||0); },0);

  // closedDate now comes from CalcEngine's last_transaction_date (cheap, already
  // part of the routine holdings payload) instead of scanning full transaction
  // detail - the full per-position history is fetched lazily, only once a card is
  // actually expanded (see toggleClosedCard), so routine loads stay lightweight.
  function closedDateFor(h){
    return h.last_transaction_date ? new Date(h.last_transaction_date) : null;
  }
  const fromDate = closedFilter.from ? new Date(closedFilter.from) : null;
  const toDate = closedFilter.to ? new Date(closedFilter.to) : null;
  const tickerNeedle = closedFilter.ticker.trim().toUpperCase();
  const closedFilteredList = closed.filter(function(h){
    if(tickerNeedle && h.asset_id.toUpperCase().indexOf(tickerNeedle) === -1) return false;
    const cd = closedDateFor(h);
    if(fromDate && cd && cd < fromDate) return false;
    if(toDate && cd && cd > toDate) return false;
    return true;
  });
  CLOSED_LIST_CACHE = closedFilteredList;
  const closedTotal = closedFilteredList.reduce(function(s,h){ return s+(h.realized_gain_base||0); },0);
  const filtersActive = !!(closedFilter.ticker || closedFilter.from || closedFilter.to);

  const closedFilterHtml = closed.length ? (
    '<div class="closed-filters">' +
    '<input type="text" name="closed-filter-ticker" id="closed-filter-ticker" placeholder="Filter ticker..." style="text-transform:uppercase;" value="' + closedFilter.ticker.replace(/"/g,'') + '" oninput="setClosedFilter(\'ticker\', this.value)" class="price-edit-input">' +
    '<input type="date" name="closed-filter-from" id="closed-filter-from" value="' + closedFilter.from + '" onchange="setClosedFilter(\'from\', this.value)" class="price-edit-input">' +
    '<span class="hint" style="align-self:center;">to</span>' +
    '<input type="date" name="closed-filter-to" id="closed-filter-to" value="' + closedFilter.to + '" onchange="setClosedFilter(\'to\', this.value)" class="price-edit-input">' +
    (filtersActive ? '<button class="refresh-btn" onclick="clearClosedFilter()">Clear</button>' : '') +
    '</div>'
  ) : '';

  const closedHtml = closedFilteredList.length ? closedFilteredList.map(function(h, ci){
    const localRealized = (h.currency!=='USD' && h.realized_gain_trade_ccy!==null && h.realized_gain_trade_ccy!==undefined)
      ? ' (' + maskable(fmtMoney(h.realized_gain_trade_ccy, h.currency)) + ')' : '';
    const partialBadge = h.quantity > 0
      ? ' <span class="hint" style="font-weight:400;">(partial - ' + h.quantity + ' still held)</span>' : '';
    return '<div class="closed-card" id="cc-' + ci + '">' +
      '<div class="closed-row" onclick="toggleClosedCard(' + ci + ')" style="cursor:pointer;">' +
      '<span>' + h.asset_id + ' - ' + (h.asset_name||'') + ' (' + h.account_id + ')' + partialBadge + '</span>' +
      '<b>Realized: ' + fmtUsd(h.realized_gain_base) + localRealized + '</b></div>' +
      '<div class="closed-detail-panel" id="cc-detail-' + ci + '"><p class="hint">Click to load transaction history...</p></div></div>';
  }).join('') : '<p class="hint">No closed positions match the current filter.</p>';
  const closedTotalHtml = closed.length ? '<div class="closed-row" style="border-color:var(--border);"><span style="font-weight:600;">Total realized P/L - ' + closedFilteredList.length + ' of ' + closed.length + ' closed position(s)</span><b class="change ' + (closedTotal>=0?'up':'down') + '">' + (closedTotal>=0?'+':'-') + maskable(fmtUsd(Math.abs(closedTotal))) + '</b></div>' : '';
  document.getElementById('cards-section').innerHTML = cardsHtml || '<p class="hint">No positions match the current filter.</p>';
  // Collapsed by default - only "TOTAL SOLD POSITIONS" + aggregate P/L show until
  // clicked; the filter bar and full list render inside the (hidden until
  // expanded) detail panel, matching the same .expanded pattern as ticker cards.
  const closedSummaryTotal = closedTotalAll;
  document.getElementById('closed-section').innerHTML =
    '<div class="closed-section-card" id="closed-toggle">' +
    '<div class="closed-row" onclick="toggleClosedSection()" style="cursor:pointer;border-color:var(--border);">' +
    '<span style="font-weight:600;">TOTAL SOLD POSITIONS (' + closed.length + ')</span>' +
    '<b class="change ' + (closedSummaryTotal>=0?'up':'down') + '">' + (closedSummaryTotal>=0?'+':'-') + maskable(fmtUsd(Math.abs(closedSummaryTotal))) + '</b></div>' +
    '<div class="closed-section-body">' + closedFilterHtml + closedTotalHtml + closedHtml + '</div>' +
    '</div>';
}
function toggleClosedSection(){
  const el = document.getElementById('closed-toggle');
  if(el) el.classList.toggle('expanded');
}
function setClosedFilter(key, value){
  closedFilter[key] = key==='ticker' ? value.toUpperCase() : value;
  // renderTickerCards() rebuilds this input's innerHTML from scratch every
  // keystroke, which replaces the DOM node and drops focus/cursor position -
  // capture it beforehand and restore it after, so typing doesn't get kicked out.
  const active = document.activeElement;
  const activeId = active && active.id;
  const selStart = active && typeof active.selectionStart === 'number' ? active.selectionStart : null;
  const selEnd = active && typeof active.selectionEnd === 'number' ? active.selectionEnd : null;
  renderTickerCards();
  if(activeId){
    const el = document.getElementById(activeId);
    if(el){
      el.focus();
      if(selStart!==null && el.setSelectionRange){ try{ el.setSelectionRange(selStart, selEnd); }catch(e){} }
    }
  }
}
function clearClosedFilter(){ closedFilter = defaultClosedFilter(); renderTickerCards(); }
let CLOSED_LIST_CACHE = [];
let CLOSED_TXN_CACHE = {};
async function toggleClosedCard(i){
  const card=document.getElementById('cc-'+i);
  if(!card) return;
  const was=card.classList.contains('expanded');
  document.querySelectorAll('.closed-card').forEach(function(c){ c.classList.remove('expanded'); });
  if(was) return; // was open, now just collapse everything above - nothing more to do
  card.classList.add('expanded');
  const h = CLOSED_LIST_CACHE[i];
  if(!h) return;
  const cacheKey = h.account_id + '::' + h.asset_id;
  const detailEl = document.getElementById('cc-detail-' + i);
  if(CLOSED_TXN_CACHE[cacheKey]){
    detailEl.innerHTML = renderTxnRows(CLOSED_TXN_CACHE[cacheKey]);
    return;
  }
  detailEl.innerHTML = '<p class="hint">Loading...</p>';
  try{
    const json = await loadData('position_transactions', { asset_id: h.asset_id, account_id: h.account_id });
    const txns = (json.transactions || []).slice().sort(function(a,b){ return new Date(b.date)-new Date(a.date); });
    CLOSED_TXN_CACHE[cacheKey] = txns;
    detailEl.innerHTML = renderTxnRows(txns);
  } catch(err){
    detailEl.innerHTML = '<p class="hint">Could not load transaction history: ' + err.message + '</p>';
  }
}
function renderTxnRows(txns){
  const rows = txns.map(function(t){
    return '<div class="lot-row"><span>' + t.date + '</span><span>' + t.action + '</span>' +
      '<span>' + (t.quantity!==undefined&&t.quantity!==null?t.quantity:'-') + '</span>' +
      '<span>' + (t.price!==undefined&&t.price!==null?fmtMoney(Number(t.price), t.trade_currency):'-') + '</span>' +
      '<span style="text-align:right">' + (t.base_currency_amount!==undefined&&t.base_currency_amount!==null?fmtUsd(Number(t.base_currency_amount)):'-') + '</span></div>';
  }).join('');
  return '<div class="lot-row head"><span>Date</span><span>Action</span><span>Qty</span><span>Price</span><span style="text-align:right">Base amt</span></div>' +
    (rows || '<p class="hint">No transaction history found for this position.</p>');
}
function toggleCard(i){
  const card=document.getElementById('tc-'+i);
  const was=card.classList.contains('expanded');
  document.querySelectorAll('.card').forEach(function(c){ c.classList.remove('expanded'); });
  if(!was) card.classList.add('expanded');
}
function renderAll(){ renderGoalAndPace(); renderFiltersAndRings(); renderTickerCards(); }
function buildAppShell(){
  document.getElementById('app').innerHTML =
    '<div id="goal-section"></div><div id="pace-section"></div><div id="capital-section"></div>' +
    '<div id="trajectory-section"></div><div id="contribution-section"></div>' +
    '<div class="breadcrumb" id="breadcrumb"></div>' +
    '<div class="filter-bar" id="filter-bar"><span class="filter-empty" id="filter-text">No filter active</span>' +
    '<button class="filter-clear" id="filter-clear-btn" style="display:none;" onclick="clearFilter()">Clear all</button></div>' +
    '<div id="region-ring-section"></div><div class="donut-grid" id="donut-grid"></div>' +
    '<p class="section-title">HOLDINGS</p><div id="cards-section"></div><div id="closed-section"></div>' +
    '<p class="hint">Live from your Sheet. Auto-refreshes every 5 min. Refresh button triggers a real price fetch (up to a minute).</p>';
}
function attachLots(lots){ HOLDINGS.forEach(function(h){ h.lots = lots.filter(function(l){ return l.account_id===h.account_id && l.asset_id===h.asset_id; }); }); }
function sleep(ms){ return new Promise(function(resolve){ setTimeout(resolve, ms); }); }
function freshFetch(url){ return fetch(url + (url.indexOf('?')>=0 ? '&' : '?') + '_ts=' + Date.now(), { cache: 'no-store' }); }
async function loadData(action, extraParams){
  let url = WEB_APP_URL + '?action=' + action;
  if (extraParams) Object.keys(extraParams).forEach(function(k){ url += '&' + k + '=' + encodeURIComponent(extraParams[k]); });
  // Apps Script Web Apps occasionally return a transient failure (404/5xx) that
  // succeeds a moment later - one retry after a short delay before giving up and
  // showing the error screen, rather than treating every blip as a hard failure.
  let lastErr;
  for(let attempt=1; attempt<=2; attempt++){
    try{
      const res = await freshFetch(url);
      if(!res.ok) throw new Error('HTTP ' + res.status + ' on action=' + action);
      const json = await res.json();
      if(json.error) throw new Error(json.error);
      return json;
    } catch(err){
      lastErr = err;
      if(attempt===1) await sleep(2000);
    }
  }
  throw lastErr;
}
function parseCardKey(cardKey){ const parts = cardKey.split('__'); return { account_id: parts[0], asset_id: parts[1] }; }
async function submitManualPrice(cardKey, inputId){
  const input = document.getElementById(inputId);
  const price = Number(input.value);
  if(!input.value || isNaN(price)){ input.focus(); return; }
  const { asset_id } = parseCardKey(cardKey);
  input.disabled = true;
  try{
    await loadData('set_manual_price', { asset_id: asset_id, price: price });
    await fullLoad(false);
  } catch(err){
    alert('Could not save manual price: ' + err.message);
    input.disabled = false;
  }
}
async function submitResumeAutoFetch(cardKey){
  const { asset_id } = parseCardKey(cardKey);
  try{
    await loadData('resume_auto_fetch', { asset_id: asset_id });
    await fullLoad(false);
  } catch(err){
    alert('Could not resume auto-fetch: ' + err.message);
  }
}
let loadInProgress = false;
async function fullLoad(triggerRefresh){
  if(loadInProgress) return; // avoid overlapping calls (auto-poll vs. manual click) piling up executions
  loadInProgress = true;
  const holdingsAction = triggerRefresh ? 'refresh' : 'holdings';
  const asofEl = document.getElementById('asof-line');
  const btn = document.getElementById('refresh-btn');
  if(btn){ btn.disabled = true; btn.textContent = triggerRefresh ? 'Fetching...' : 'Loading...'; }
  if(triggerRefresh) asofEl.textContent = 'Fetching live prices - can take up to a minute...';
  try{
    const hJson = await loadData(holdingsAction);
    HOLDINGS = hJson.holdingsSummary || [];
    attachLots(hJson.holdingsLots || []);
    const results = await Promise.all([loadData('accounts'), loadData('targets'), loadData('transactions')]);
    ACCOUNTS = results[0].accounts || []; TARGETS = results[1].targets || []; TRANSACTIONS = results[2].transactions || [];
    asofEl.textContent = 'Live as of ' + new Date(hJson.asOfDate).toLocaleString() +
      (hJson.warnings && hJson.warnings.length ? ' - ' + hJson.warnings.length + ' warning(s)' : '') +
      (hJson.refreshedPrices ? ' - prices just refreshed' : '');
    buildAppShell(); renderAll();
  } catch(err){
    document.getElementById('app').innerHTML = '<div class="error-box"><b>Could not load live data</b><br><br>' + err.message + '<br><br><button class="refresh-btn" onclick="fullLoad(false)">Retry</button></div>';
    console.error(err);
  } finally {
    if(btn){ btn.disabled = false; btn.textContent = 'Refresh prices'; }
    loadInProgress = false;
  }
}
setInterval(function(){ fullLoad(false); }, 5*60*1000);
fullLoad(false);
</script>
