<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portfolio Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#09080B; --surface:#121116; --surface-2:#17161C;
    --border:#232129; --border-soft:#1B1A20;
    --text:#EEEAE2; --text-dim:#8D8A96; --text-faint:#514F5A;
    --gold:#C9A227; --gold-bright:#DFC15A; --gold-dim:#6B5A20;
    --blue:#4F8FE8; --green:#35C48C; --orange:#E2883D; --purple:#B98FE0;
    --teal:#2DBFAE; --rose:#D67AB1; --red:#E2596B; --gray:#5B6774;
    --serif:'Playfair Display', serif;
    --mono:'IBM Plex Mono', monospace;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:var(--mono);padding:36px 16px 90px;min-height:100vh;}
  .wrap{max-width:640px;margin:0 auto;}

  .page-title{font-size:11px;letter-spacing:.12em;color:var(--text-faint);margin-bottom:4px;}
  .page-sub{font-size:10.5px;color:var(--text-faint);margin-bottom:22px;}

  .loading, .error-box{text-align:center;padding:60px 20px;color:var(--text-dim);}
  .error-box{color:var(--red);border:1px solid var(--red);border-radius:10px;background:rgba(226,89,106,.06);}
  .spinner{width:22px;height:22px;border:2px solid var(--border);border-top-color:var(--gold);border-radius:50%;
    animation:spin .8s linear infinite;margin:0 auto 14px;}
  @keyframes spin{to{transform:rotate(360deg);}}

  /* ══ Goal card ══ */
  .goal-card{background:var(--surface);border:1px solid var(--border-soft);border-radius:12px;padding:22px 20px;margin-bottom:14px;}
  .goal-flex{display:flex;gap:18px;align-items:center;}
  .ring-wrap{position:relative;width:140px;height:140px;flex:none;}
  .ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;}
  .rc-eyebrow{font-size:8px;letter-spacing:.12em;color:var(--text-faint);}
  .rc-value{font-family:var(--serif);font-size:18px;font-weight:600;margin:4px 0 2px;}
  .rc-pct{font-size:9px;color:var(--gold-bright);font-family:var(--serif);font-style:italic;}
  .goal-detail{flex:1;min-width:0;}
  .gd-row{display:flex;justify-content:space-between;font-size:10px;color:var(--text-dim);padding:4px 0;border-bottom:1px solid var(--border-soft);}
  .gd-row:last-child{border-bottom:none;}
  .gd-row .k{color:var(--text-faint);}
  .gd-row .v{font-weight:500;}
  .gd-row .v.loss{color:var(--red);}
  .gd-row .v.gain{color:var(--green);}
  .eta-strip{display:flex;justify-content:space-between;margin-top:14px;padding-top:13px;border-top:1px solid var(--border);}
  .eta-block{text-align:center;flex:1;}
  .eta-eyebrow{font-size:7.5px;letter-spacing:.1em;color:var(--text-faint);margin-bottom:3px;}
  .eta-value{font-family:var(--serif);font-size:16px;color:var(--text);}
  .eta-value.target{color:var(--gold-bright);}
  .eta-value.projected{color:var(--orange);}

  /* ══ Pace bar ══ */
  .pace-card{background:var(--surface);border:1px solid var(--border-soft);border-radius:12px;padding:18px 20px 14px;margin-bottom:14px;}
  .pace-title{font-size:10px;letter-spacing:.1em;color:var(--text-faint);margin-bottom:16px;}
  .track-wrap{position:relative;height:34px;margin-bottom:6px;}
  .track{position:absolute;top:14px;left:0;right:0;height:6px;background:var(--border);border-radius:3px;}
  .track-fill{position:absolute;top:0;left:0;height:6px;border-radius:3px;background:linear-gradient(90deg, var(--blue), #7BB3F5);}
  .milestone{position:absolute;top:12px;width:9px;height:9px;border-radius:50%;background:var(--bg);border:2px solid var(--border);transform:translateX(-50%);}
  .milestone.passed{border-color:var(--gold);background:var(--gold);}
  .milestone-label{position:absolute;top:24px;font-size:8px;color:var(--text-faint);transform:translateX(-50%);white-space:nowrap;}
  .runner-marker{position:absolute;top:-9px;width:22px;height:22px;border-radius:50%;background:var(--blue);border:3px solid var(--bg);
    box-shadow:0 0 0 2px var(--blue),0 0 10px rgba(79,143,232,.5);transform:translateX(-50%);display:flex;align-items:center;justify-content:center;}
  .runner-marker svg{width:12px;height:12px;color:#08131F;}

  /* ══ Filter bar + rings ══ */
  .breadcrumb{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:8px;}
  .crumb{display:flex;align-items:center;gap:5px;font-size:10px;background:var(--surface-2);border:1px solid var(--border);border-radius:5px;padding:3px 7px;color:var(--text-dim);}
  .crumb button{background:none;border:none;color:var(--text-faint);cursor:pointer;font-size:11px;padding:0;}
  .crumb-arrow{color:var(--text-faint);font-size:10px;}
  .filter-bar{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--surface);border:1px solid var(--border-soft);border-radius:9px;padding:9px 13px;margin-bottom:14px;font-size:10.5px;color:var(--text-dim);}
  .filter-bar.active{border-color:var(--gold);}
  .filter-clear{font-family:var(--mono);font-size:10px;font-weight:600;color:var(--gold-bright);background:none;border:none;cursor:pointer;}
  .filter-empty{color:var(--text-faint);}

  .region-card{background:var(--surface);border:1px solid var(--border-soft);border-radius:11px;padding:16px 18px;margin-bottom:10px;}
  .region-title{font-size:10px;letter-spacing:.1em;color:var(--text-faint);margin-bottom:12px;}
  .region-body{display:flex;align-items:center;gap:16px;}
  .region-ring{position:relative;width:104px;height:104px;flex:none;}
  .region-svg path{cursor:pointer;transition:opacity .15s ease, transform .15s ease;transform-origin:center;}
  .region-svg path.dim{opacity:.22;}
  .region-svg path.selected{transform:scale(1.04);}
  .region-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;}
  .region-center .v{font-family:var(--serif);font-size:14px;font-weight:600;}
  .region-center .k{font-size:7.5px;color:var(--text-faint);}
  .region-legend{flex:1;display:flex;flex-direction:column;gap:7px;min-width:0;}
  .rl-row{display:flex;align-items:center;gap:7px;cursor:pointer;font-size:10.5px;transition:opacity .15s ease;}
  .rl-row.dim{opacity:.35;}
  .rl-sw{width:8px;height:8px;border-radius:2px;flex:none;}
  .rl-label{flex:1;color:var(--text-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .rl-val{font-family:var(--mono);color:var(--text-faint);font-size:9.5px;}

  .donut-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px;}
  @media (max-width:460px){.donut-grid{grid-template-columns:1fr;}}
  .donut-card{background:var(--surface);border:1px solid var(--border-soft);border-radius:10px;padding:14px;}
  .donut-title{font-size:9px;letter-spacing:.08em;color:var(--text-faint);margin-bottom:10px;}
  .donut-body{display:flex;align-items:center;gap:10px;}
  .donut-svg path{cursor:pointer;transition:opacity .15s ease, transform .15s ease;transform-origin:center;}
  .donut-svg path.dim{opacity:.22;}
  .donut-svg path.selected{transform:scale(1.045);}
  .donut-center{position:relative;}
  .donut-center-label{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;pointer-events:none;}
  .donut-center-label .v{font-family:var(--serif);font-size:11px;font-weight:600;}
  .donut-center-label .k{font-size:6px;color:var(--text-faint);}
  .legend-list{display:flex;flex-direction:column;gap:5px;flex:1;min-width:0;}
  .legend-row{display:flex;align-items:center;gap:6px;cursor:pointer;font-size:9.5px;transition:opacity .15s ease;}
  .legend-row.dim{opacity:.35;}
  .legend-sw{width:7px;height:7px;border-radius:2px;flex:none;}
  .legend-label{flex:1;color:var(--text-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .legend-val{font-family:var(--mono);color:var(--text-faint);font-size:9px;}

  /* ══ Ticker cards ══ */
  .section-title{font-size:10px;letter-spacing:.1em;color:var(--text-faint);margin:18px 0 10px;}
  .cash-line{background:var(--surface);border:1px solid var(--border-soft);border-radius:9px;padding:10px 14px;margin-bottom:10px;
    display:flex;justify-content:space-between;font-size:10.5px;color:var(--text-dim);}
  .cash-line b{color:var(--text);font-family:var(--mono);}

  .card{background:var(--surface);border:1px solid var(--border-soft);border-radius:9px;margin-bottom:6px;overflow:hidden;}
  .card:hover{border-color:var(--border);}
  .card.expanded{border-color:var(--blue);}
  .row{display:flex;align-items:center;gap:10px;padding:11px 14px;cursor:pointer;user-select:none;}
  .left-col{display:flex;flex-direction:column;gap:2px;flex:1;min-width:0;}
  .ticker-line{display:flex;align-items:baseline;gap:6px;}
  .ticker{font-family:var(--mono);font-weight:600;font-size:13px;}
  .qty{font-family:var(--mono);font-size:10px;color:var(--text-faint);}
  .quality-num{font-family:var(--mono);font-size:9.5px;font-weight:600;padding:0 4px;border-radius:3px;}
  .q-high{background:rgba(53,196,140,.12);color:var(--green);}
  .q-mid{background:rgba(226,136,61,.12);color:var(--orange);}
  .q-low{background:rgba(226,89,106,.12);color:var(--red);}
  .name{font-size:10px;color:var(--text-faint);}
  .right-col{display:flex;flex-direction:column;align-items:flex-end;gap:1px;flex:none;min-width:92px;}
  .mkt-value{font-family:var(--mono);font-size:13px;font-weight:600;}
  .ltp-line{display:flex;align-items:center;gap:5px;}
  .ltp{font-family:var(--mono);font-size:9.5px;color:var(--text-dim);}
  .change{font-family:var(--mono);font-size:9.5px;}
  .change.up{color:var(--green);}
  .change.down{color:var(--red);}
  .change.flat{color:var(--text-faint);}
  .stale-badge{font-size:8px;padding:1px 5px;border-radius:3px;background:rgba(226,89,106,.12);color:var(--red);margin-top:1px;}
  .chevron{color:var(--text-faint);font-size:9px;flex:none;transition:transform .15s ease;}
  .card.expanded .chevron{transform:rotate(180deg);}
  .panel{border-top:1px solid var(--border-soft);padding:12px 14px;display:none;background:var(--surface-2);}
  .card.expanded .panel{display:block;}
  .meta-line{font-size:9.5px;font-family:var(--mono);color:var(--text-faint);margin-bottom:10px;line-height:1.6;}
  .lot-row{display:grid;grid-template-columns:1.1fr .7fr .9fr .8fr 1fr;gap:6px;padding:5px 0;border-bottom:1px solid var(--border-soft);
    font-family:var(--mono);font-size:9.5px;align-items:center;}
  .lot-row:last-child{border-bottom:none;}
  .lot-row.head{color:var(--text-faint);font-size:8px;text-transform:uppercase;font-family:var(--sans);font-weight:600;}
  .lot-gl{display:flex;align-items:center;gap:3px;justify-content:flex-end;}
  .lot-gl.up{color:var(--green);}
  .lot-gl.down{color:var(--red);}
  .lot-term{font-size:8px;padding:1px 4px;border-radius:3px;}
  .lot-term.ltcg{background:rgba(53,196,140,.1);color:var(--green);}
  .lot-term.stcg{background:rgba(226,136,61,.1);color:var(--orange);}
  .scissors{width:9px;height:9px;color:var(--purple);}

  .hint{font-size:10px;color:var(--text-faint);margin-top:18px;line-height:1.6;}
  .refresh-btn{font-family:var(--mono);font-size:10px;color:var(--gold-bright);background:none;border:1px solid var(--border);
    border-radius:6px;padding:5px 10px;cursor:pointer;float:right;}
</style>
</head>
<body>
<div class="wrap">
  <p class="page-title">PORTFOLIO OVERVIEW</p>
  <p class="page-sub" id="asof-line">Loading real data from your sheet...</p>
  <div id="app">
    <div class="loading"><div class="spinner"></div>Fetching live holdings...</div>
  </div>
</div>

<script>
const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbxDlF0FdzPAra-qf0EMJeIDeZr2Iw57ZLjbMookr8fuPsQOmURMS_GGtU8k97DFpKE42A/exec';

let HOLDINGS = [];
let ACCOUNTS = [];
let TARGETS = [];
let filterChain = [];

async function loadAll(){
  try{
    const [hRes, aRes, tRes] = await Promise.all([
      fetch(WEB_APP_URL + '?action=holdings'),
      fetch(WEB_APP_URL + '?action=accounts'),
      fetch(WEB_APP_URL + '?action=targets'),
    ]);
    if(!hRes.ok || !aRes.ok || !tRes.ok) throw new Error('One or more requests failed (HTTP ' + hRes.status + ')');
    const hJson = await hRes.json();
    const aJson = await aRes.json();
    const tJson = await tRes.json();
    if(hJson.error) throw new Error(hJson.error);

    HOLDINGS = hJson.holdingsSummary || [];
    ACCOUNTS = aJson.accounts || [];
    TARGETS = tJson.targets || [];

    document.getElementById('asof-line').textContent =
      'Live as of ' + new Date(hJson.asOfDate).toLocaleString() +
      (hJson.warnings && hJson.warnings.length ? ' — ' + hJson.warnings.length + ' warning(s), check the Sheet log' : '');

    renderAll();
  } catch(err){
    document.getElementById('app').innerHTML =
      '<div class="error-box"><b>Could not load live data</b><br><br>' + err.message +
      '<br><br><button class="refresh-btn" onclick="loadAll()">Retry</button></div>';
    console.error(err);
  }
}

function accountBroker(accountId){
  const a = ACCOUNTS.find(x => x.account_id === accountId);
  return a ? a.broker : accountId;
}
function accountRegion(accountId){
  const a = ACCOUNTS.find(x => x.account_id === accountId);
  return a ? a.dashboard_region : 'Other';
}
function activeTarget(){
  const today = new Date();
  const sorted = TARGETS.slice().sort((a,b) => new Date(a.effective_date) - new Date(b.effective_date));
  let active = sorted[0];
  sorted.forEach(t => { if(new Date(t.effective_date) <= today) active = t; });
  return active;
}
function fmtMoney(v, ccy){
  if(v === null || v === undefined) return '—';
  const sym = ccy === 'INR' ? '₹' : ccy === 'AED' ? 'AED ' : '$';
  return sym + Math.abs(v).toLocaleString(undefined, {maximumFractionDigits:0}) + (v<0?' (neg)':'');
}
function fmtUsd(v){
  if(v === null || v === undefined) return '—';
  return '$' + v.toLocaleString(undefined, {maximumFractionDigits:0});
}

/* ================= Goal card + pace bar + trajectory ================= */
function renderGoalAndPace(){
  const target = activeTarget();
  const nonCash = HOLDINGS.filter(h => !String(h.asset_id).startsWith('CASH-'));
  const cashRows = HOLDINGS.filter(h => String(h.asset_id).startsWith('CASH-'));

  const knownValue = HOLDINGS.reduce((s,h) => s + (h.market_value_base || 0), 0);
  const unpriced = nonCash.filter(h => h.market_value_base === null);
  const totalInvested = nonCash.reduce((s,h) => s + (h.avg_cost_per_unit * h.quantity / (h.fx_rate_used||1)), 0); // approx, informational only

  const goalAmount = target ? Number(target.goal_amount_usd) : null;
  const targetDate = target ? target.target_date : null;
  const targetCagr = target ? Number(target.target_cagr) : null;
  const monthly = target ? Number(target.monthly_contribution_usd) : null;

  const pct = goalAmount ? (knownValue/goalAmount*100) : 0;
  const milestonePcts = [12.5, 25, 50, 100];

  document.getElementById('goal-section').innerHTML = `
    <div class="goal-card">
      <div class="goal-flex">
        <div class="ring-wrap">
          <svg width="140" height="140" viewBox="0 0 140 140" style="transform:rotate(-90deg)">
            <circle cx="70" cy="70" r="60" fill="none" stroke="#1E1C24" stroke-width="7"/>
            <circle cx="70" cy="70" r="60" fill="none" stroke="#4F8FE8" stroke-width="7"
              stroke-dasharray="${(pct/100*2*Math.PI*60).toFixed(1)} 10000" stroke-linecap="round"/>
          </svg>
          <div class="ring-center">
            <div class="rc-eyebrow">PORTFOLIO</div>
            <div class="rc-value">${fmtUsd(knownValue)}</div>
            <div class="rc-pct">${goalAmount ? pct.toFixed(1)+'% of '+fmtUsd(goalAmount) : 'no active target set'}</div>
          </div>
        </div>
        <div class="goal-detail">
          <div class="gd-row"><span class="k">Positions</span><span class="v">${nonCash.length}</span></div>
          <div class="gd-row"><span class="k">Cash (all accounts)</span><span class="v">${fmtUsd(cashRows.reduce((s,h)=>s+(h.market_value_base||0),0))}</span></div>
          <div class="gd-row"><span class="k">No live price yet</span><span class="v ${unpriced.length?'loss':''}">${unpriced.length} position${unpriced.length!==1?'s':''}</span></div>
        </div>
      </div>
      ${target ? `
      <div class="eta-strip">
        <div class="eta-block"><div class="eta-eyebrow">TARGET DATE</div><div class="eta-value target">${new Date(targetDate).getFullYear()}</div></div>
        <div class="eta-block"><div class="eta-eyebrow">TARGET CAGR</div><div class="eta-value">${targetCagr}%</div></div>
        <div class="eta-block"><div class="eta-eyebrow">MONTHLY PLAN</div><div class="eta-value">${fmtUsd(monthly)}</div></div>
      </div>` : `<p class="hint" style="margin-top:12px;">No row in <b>targets</b> is active as of today - add one to see goal progress.</p>`}
    </div>
  `;

  const trackHtml = `
    <div class="track-wrap">
      <div class="track"><div class="track-fill" style="width:${Math.min(pct,100)}%"></div></div>
      ${milestonePcts.map(m => `
        <div class="milestone ${pct>=m?'passed':''}" style="left:${m}%"></div>
        <div class="milestone-label" style="left:${m}%">${m}%</div>
      `).join('')}
      <div class="runner-marker" style="left:${Math.min(pct,100)}%">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M13.49 5.48c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm-3.6 13.9l1-4.4 2.1 2v6h2v-7.5l-2.1-2 .6-3c1.3 1.5 3.3 2.5 5.5 2.5v-2c-1.9 0-3.5-1-4.3-2.4l-1-1.6c-.4-.6-1-1-1.7-1-.3 0-.5.1-.8.1l-5.2 2.2v4.7h2v-3.4l1.8-.7-1.6 8.1-4.9-1-.4 2 7 1.4z"/></svg>
      </div>
    </div>
  `;
  document.getElementById('pace-section').innerHTML = `
    <div class="pace-card">
      <div class="pace-title">PROGRESS TO GOAL — milestones at 12.5/25/50/100% of goal_amount_usd, sheet-driven</div>
      ${trackHtml}
    </div>
  `;
}

/* ================= Filterable rings ================= */
function polarToCartesian(cx,cy,r,angleDeg){const a=(angleDeg-90)*Math.PI/180;return{x:cx+r*Math.cos(a),y:cy+r*Math.sin(a)};}
function arcPath(cx,cy,rOuter,rInner,startAngle,endAngle){
  const p1=polarToCartesian(cx,cy,rOuter,endAngle),p2=polarToCartesian(cx,cy,rOuter,startAngle);
  const p3=polarToCartesian(cx,cy,rInner,startAngle),p4=polarToCartesian(cx,cy,rInner,endAngle);
  const large=endAngle-startAngle>180?1:0;
  return `M ${p1.x} ${p1.y} A ${rOuter} ${rOuter} 0 ${large} 0 ${p2.x} ${p2.y} L ${p3.x} ${p3.y} A ${rInner} ${rInner} 0 ${large} 1 ${p4.x} ${p4.y} Z`;
}
function resolveColor(v){const el=document.createElement('div');el.style.color=v;document.body.appendChild(el);const c=getComputedStyle(el).color;document.body.removeChild(el);return c;}

const DIM_COLORS = {
  region: {US:'var(--blue)',UAE:'var(--green)',India:'var(--orange)',Crypto:'var(--purple)',Other:'var(--gray)'},
  currency: {USD:'var(--blue)',AED:'var(--teal)',INR:'var(--rose)'},
  classification: {Core:'var(--green)',Tactical:'var(--blue)',Hedge:'var(--red)'},
  cap: {Large:'var(--blue)',Mid:'var(--teal)',Small:'var(--orange)',NA:'var(--gray)'},
  broker: {},
};

function dimValue(h, dim){
  if(dim==='region') return h.region;
  if(dim==='currency') return h.currency;
  if(dim==='classification') return h.classification || 'Unclassified';
  if(dim==='cap') return h.market_cap_segment || 'NA';
  if(dim==='broker') return accountBroker(h.account_id);
  return 'Other';
}
function colorFor(dim, label){
  if(DIM_COLORS[dim][label]) return DIM_COLORS[dim][label];
  const palette = ['var(--blue)','var(--green)','var(--orange)','var(--purple)','var(--teal)','var(--rose)'];
  const idx = Object.keys(DIM_COLORS[dim]).length % palette.length;
  DIM_COLORS[dim][label] = palette[idx];
  return DIM_COLORS[dim][label];
}

function applyChainExcept(exceptDim, data){
  return data.filter(h => filterChain.every(f => f.dim===exceptDim ? true : dimValue(h,f.dim)===f.value));
}
function fullyFiltered(data){ return data.filter(h => filterChain.every(f => dimValue(h,f.dim)===f.value)); }

function aggregate(dim, data){
  const map = {};
  data.forEach(h => {
    const label = dimValue(h,dim);
    map[label] = (map[label]||0) + (h.market_value_base||0);
  });
  return Object.entries(map).map(([label,value])=>({label,value})).sort((a,b)=>b.value-a.value);
}

function computeRendered(dim, data){
  const activeInThisDim = filterChain.find(f=>f.dim===dim);
  const baseData = applyChainExcept(dim, data);
  const slices = aggregate(dim, baseData);
  const total = slices.reduce((s,d)=>s+d.value,0);
  let angle=0;
  const rendered = slices.map(s=>{
    const pct = total ? s.value/total : 0;
    const startAngle=angle, endAngle=angle+pct*360; angle=endAngle;
    const isSelected = activeInThisDim && activeInThisDim.value===s.label;
    const isDimmed = activeInThisDim && activeInThisDim.value!==s.label;
    return {...s, startAngle, endAngle, pct, isSelected, isDimmed, color:colorFor(dim,s.label)};
  });
  return {rendered, total, activeInThisDim};
}

function renderRegionRing(allData){
  const {rendered, total, activeInThisDim} = computeRendered('region', allData);
  const paths = rendered.map(s=>`<path d="${arcPath(52,52,46,30,s.startAngle,s.endAngle)}" fill="${resolveColor(s.color)}"
    class="${s.isSelected?'selected':''} ${s.isDimmed?'dim':''}" onclick="onSliceClick('region','${s.label}')"></path>`).join('');
  const centerVal = fmtUsd(total);
  const centerLabel = activeInThisDim ? activeInThisDim.value : (filterChain.length?'Subset':'Total');
  const legend = rendered.map(s=>`<div class="rl-row ${s.isDimmed?'dim':''}" onclick="onSliceClick('region','${s.label}')">
    <span class="rl-sw" style="background:${resolveColor(s.color)}"></span><span class="rl-label">${s.label}</span>
    <span class="rl-val">${fmtUsd(s.value)} · ${Math.round(s.pct*100)}%</span></div>`).join('');
  return `<div class="region-card"><div class="region-title">BY REGION</div><div class="region-body">
    <div class="region-ring"><svg class="region-svg" width="104" height="104" viewBox="0 0 104 104">${paths}</svg>
      <div class="region-center"><div class="v">${centerVal}</div><div class="k">${centerLabel}</div></div></div>
    <div class="region-legend">${legend}</div></div></div>`;
}

function renderDonut(dim, title, allData){
  const {rendered, total, activeInThisDim} = computeRendered(dim, allData);
  const paths = rendered.map(s=>`<path d="${arcPath(40,40,32,20,s.startAngle,s.endAngle)}" fill="${resolveColor(s.color)}"
    class="${s.isSelected?'selected':''} ${s.isDimmed?'dim':''}" onclick="onSliceClick('${dim}','${s.label}')"></path>`).join('');
  const centerVal = fmtUsd(total);
  const centerLabel = activeInThisDim ? activeInThisDim.value : (filterChain.length?'Subset':'Total');
  const legend = rendered.map(s=>`<div class="legend-row ${s.isDimmed?'dim':''}" onclick="onSliceClick('${dim}','${s.label}')">
    <span class="legend-sw" style="background:${resolveColor(s.color)}"></span><span class="legend-label">${s.label}</span>
    <span class="legend-val">${Math.round(s.pct*100)}%</span></div>`).join('');
  return `<div class="donut-card"><div class="donut-title">${title}</div><div class="donut-body">
    <div class="donut-center"><svg class="donut-svg" width="80" height="80" viewBox="0 0 80 80">${paths}</svg>
      <div class="donut-center-label"><div class="v">${centerVal}</div><div class="k">${centerLabel}</div></div></div>
    <div class="legend-list">${legend}</div></div></div>`;
}

function onSliceClick(dim, value){
  const idx = filterChain.findIndex(f=>f.dim===dim);
  if(idx>=0){ if(filterChain[idx].value===value) filterChain.splice(idx,1); else filterChain[idx]={dim,value}; }
  else filterChain.push({dim,value});
  renderAll();
}
function removeCrumb(i){ filterChain.splice(i,1); renderAll(); }
function clearFilter(){ filterChain=[]; renderAll(); }

function renderFiltersAndRings(){
  const allData = HOLDINGS; // includes cash, for accurate totals
  document.getElementById('region-ring-section').innerHTML = renderRegionRing(allData);
  document.getElementById('donut-grid').innerHTML =
    renderDonut('currency','BY CURRENCY', allData) +
    renderDonut('classification','BY CLASSIFICATION', allData) +
    renderDonut('cap','BY MARKET CAP', allData) +
    renderDonut('broker','BY BROKER', allData);

  const crumbWrap = document.getElementById('breadcrumb');
  crumbWrap.innerHTML = filterChain.map((f,i)=>`${i>0?'<span class="crumb-arrow">→</span>':''}
    <span class="crumb">${f.value}<button onclick="removeCrumb(${i})">✕</button></span>`).join('');

  const bar=document.getElementById('filter-bar'), text=document.getElementById('filter-text'), btn=document.getElementById('filter-clear-btn');
  if(filterChain.length){
    const subset = fullyFiltered(allData);
    bar.classList.add('active'); text.classList.remove('filter-empty');
    text.textContent = `Filtered: ${fmtUsd(subset.reduce((s,h)=>s+(h.market_value_base||0),0))} · ${subset.length} position${subset.length!==1?'s':''}`;
    btn.style.display='inline-block';
  } else {
    bar.classList.remove('active'); text.classList.add('filter-empty');
    text.textContent = 'No filter active — showing full portfolio';
    btn.style.display='none';
  }
}

/* ================= Ticker cards ================= */
function qClass(q){ if(q===''||q===null||q===undefined) return 'q-mid'; return q>=7.5?'q-high':q>=5.5?'q-mid':'q-low'; }

function renderTickerCards(){
  const filtered = fullyFiltered(HOLDINGS);
  const positions = filtered.filter(h => !String(h.asset_id).startsWith('CASH-'));
  const cash = filtered.filter(h => String(h.asset_id).startsWith('CASH-'));

  const sorted = positions.slice().sort((a,b) => (b.market_value_base||0) - (a.market_value_base||0));

  const cashHtml = cash.length ? cash.map(c => `
    <div class="cash-line"><span>${c.asset_name} (${c.account_id})</span><b>${fmtMoney(c.quantity, c.currency)}</b></div>
  `).join('') : '';

  const cardsHtml = sorted.map((h,i) => {
    const changeDir = h.day_gain_pct===null ? 'flat' : h.day_gain_pct>0 ? 'up' : h.day_gain_pct<0 ? 'down' : 'flat';
    const changeStr = h.day_gain_pct===null ? '—' : (h.day_gain_pct>0?'+':'') + h.day_gain_pct.toFixed(2) + '%';
    const stale = h.price_stale_days !== null && h.price_stale_days > 10;
    return `
    <div class="card" id="tc-${i}">
      <div class="row" onclick="toggleCard(${i})">
        <div class="left-col">
          <div class="ticker-line">
            <span class="ticker">${h.asset_id}</span>
            <span class="qty">×${Number(h.quantity).toLocaleString(undefined,{maximumFractionDigits:4})}</span>
            <span class="quality-num ${qClass(h.conviction)}">${h.conviction!==''&&h.conviction!==null? Number(h.conviction).toFixed(1) : '—'}</span>
          </div>
          <span class="name">${h.asset_name||''} · ${h.account_id}</span>
        </div>
        <div class="right-col">
          <span class="mkt-value">${h.market_value_base!==null?fmtUsd(h.market_value_base):'no price'}</span>
          <div class="ltp-line">
            <span class="ltp">${h.latest_price!==null?h.latest_price.toLocaleString(undefined,{maximumFractionDigits:2})+' '+h.currency:'—'}</span>
            <span class="change ${changeDir}">${changeStr}</span>
          </div>
          ${stale?`<span class="stale-badge">${h.price_stale_days}d stale</span>`:''}
        </div>
        <span class="chevron">▾</span>
      </div>
      <div class="panel">
        <div class="meta-line">
          Avg cost ${h.avg_cost_per_unit.toFixed(4)} ${h.currency} · Unrealized ${h.unrealized_gain_base!==null?fmtUsd(h.unrealized_gain_base):'—'}
          · Realized ${fmtUsd(h.realized_gain_base)} · Fees paid ${fmtUsd(h.total_fees_paid_base)}
        </div>
        <div class="lot-row head"><span>Lot</span><span>Qty</span><span>Cost</span><span>Term</span><span style="text-align:right">G/L</span></div>
        ${(h.lots||[]).map(l=>`
          <div class="lot-row">
            <span>${l.lot_id}<br><span style="color:var(--text-faint)">${l.date}</span></span>
            <span>${l.qty}</span>
            <span>${l.cost_per_unit}</span>
            <span>${l.term?`<span class="lot-term ${l.term.toLowerCase()}">${l.term}</span>`:'—'}</span>
            <span class="lot-gl ${l.unrealized_gain_base>=0?'up':'down'}">${l.harvest_candidate?'✂ ':''}${l.unrealized_gain_base!==null?fmtUsd(l.unrealized_gain_base):'—'}</span>
          </div>`).join('')}
      </div>
    </div>`;
  }).join('');

  document.getElementById('cash-section').innerHTML = cashHtml;
  document.getElementById('cards-section').innerHTML = cardsHtml || '<p class="hint">No positions match the current filter.</p>';
}
function toggleCard(i){
  const card=document.getElementById('tc-'+i);
  const was=card.classList.contains('expanded');
  document.querySelectorAll('.card').forEach(c=>c.classList.remove('expanded'));
  if(!was) card.classList.add('expanded');
}

/* ================= Orchestration ================= */
function renderAll(){
  renderGoalAndPace();
  renderFiltersAndRings();
  renderTickerCards();
}

function buildAppShell(){
  document.getElementById('app').innerHTML = `
    <div id="goal-section"></div>
    <div id="pace-section"></div>
    <div class="breadcrumb" id="breadcrumb"></div>
    <div class="filter-bar" id="filter-bar">
      <span class="filter-empty" id="filter-text">No filter active — showing full portfolio</span>
      <button class="filter-clear" id="filter-clear-btn" style="display:none;" onclick="clearFilter()">Clear all ✕</button>
    </div>
    <div id="region-ring-section"></div>
    <div class="donut-grid" id="donut-grid"></div>
    <p class="section-title">HOLDINGS ${filterChain.length?'(filtered)':''}</p>
    <div id="cash-section"></div>
    <div id="cards-section"></div>
    <p class="hint">Live from your Sheet via the deployed Web App. Lot-level detail attaches to each holding automatically - tap a card to expand.</p>
  `;
}

// attach lots to holdings once, for card expansion
function attachLots(lots){
  HOLDINGS.forEach(h => { h.lots = lots.filter(l => l.account_id===h.account_id && l.asset_id===h.asset_id); });
}

(async function init(){
  try{
    const res = await fetch(WEB_APP_URL + '?action=holdings');
    if(!res.ok) throw new Error('HTTP ' + res.status);
    const json = await res.json();
    if(json.error) throw new Error(json.error);
    HOLDINGS = json.holdingsSummary || [];
    attachLots(json.holdingsLots || []);

    const [aRes, tRes] = await Promise.all([fetch(WEB_APP_URL+'?action=accounts'), fetch(WEB_APP_URL+'?action=targets')]);
    ACCOUNTS = (await aRes.json()).accounts || [];
    TARGETS = (await tRes.json()).targets || [];

    document.getElementById('asof-line').textContent =
      'Live as of ' + new Date(json.asOfDate).toLocaleString() +
      (json.warnings && json.warnings.length ? ' — ' + json.warnings.length + ' warning(s)' : '');

    buildAppShell();
    renderAll();
  } catch(err){
    document.getElementById('app').innerHTML =
      '<div class="error-box"><b>Could not load live data</b><br><br>' + err.message +
      '<br><br>If this is a CORS or network error, the Web App URL/deployment settings may need checking.' +
      '<br><br><button class="refresh-btn" onclick="location.reload()">Retry</button></div>';
    console.error(err);
  }
})();
</script>
